name: CI / CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  firmware:
    name: ESP32-S3 Firmware (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            firmware/.pio
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run -d firmware

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: espMoto-firmware-bins
          path: |
            firmware/.pio/build/m5stack-stopwatch/firmware.bin
            firmware/.pio/build/m5stack-stopwatch/bootloader.bin
            firmware/.pio/build/m5stack-stopwatch/partitions.bin

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/.pio/build/m5stack-stopwatch/firmware.bin
            firmware/.pio/build/m5stack-stopwatch/bootloader.bin
            firmware/.pio/build/m5stack-stopwatch/partitions.bin
          generate_release_notes: true
